<script>
  // legacy post links: /blog/p/?s=slug  ->  /blog/slug/
  (function () {
    var s = new URLSearchParams(location.search).get("s");
    location.replace(s && /^[a-z0-9-]+$/i.test(s) ? "/blog/" + s + "/" : "/blog/");
  })();
</script>
